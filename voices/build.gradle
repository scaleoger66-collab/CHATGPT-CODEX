plugins { id 'com.android.application' }
android {
    namespace 'de.sprechbruecke.voices'
    compileSdk 35
    defaultConfig {
        applicationId 'de.sprechbruecke.voices'; minSdk 31; targetSdk 35; versionCode 1; versionName '0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        debug {
            def ciKey = System.getenv('SPRECHBRUECKE_DEBUG_KEYSTORE')
            if (ciKey != null) storeFile file(ciKey)
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'commons-io:commons-io:2.18.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
