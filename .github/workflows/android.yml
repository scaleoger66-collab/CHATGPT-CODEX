name: Android APK

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test, lint and build APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature and create checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          mv app-debug.apk Sprechbruecke-v0.1-debug.apk
          sha256sum Sprechbruecke-v0.1-debug.apk > SHA256SUMS.txt
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Sprechbruecke-v0.1-Android
          path: |
            app/build/outputs/apk/debug/Sprechbruecke-v0.1-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: app/build/reports/
          if-no-files-found: ignore
