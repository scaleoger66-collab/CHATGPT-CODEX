name: Android APK

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SPRECHBRUECKE_DEBUG_KEYSTORE: ${{ github.workspace }}/.debug-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Keep debug signing key for subsequent test updates
        uses: actions/cache@v4
        with:
          path: .debug-signing/debug.keystore
          key: sprechbruecke-debug-signing-v2
      - name: Ensure explicit debug signing key
        run: |
          mkdir -p .debug-signing
          if [ ! -f "$SPRECHBRUECKE_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$SPRECHBRUECKE_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s "$SPRECHBRUECKE_DEBUG_KEYSTORE"
      - name: Fetch pinned offline speech runtime
        run: bash ci/fetch-sherpa.sh
      - name: Test, lint and build APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Check design switching on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -memory 4096 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/android-ui-tests.sh
      - name: Verify APK signature and create checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs voices/build/outputs/apk/debug/voices-debug.apk
          mkdir -p distribution
          cp app/build/outputs/apk/debug/app-debug.apk distribution/Sprechbruecke-v0.5-debug.apk
          cp voices/build/outputs/apk/debug/voices-debug.apk distribution/Sprechbruecke-Stimmen-v0.1.apk
          cp voices/src/main/assets/GPL-3.0.txt voices/src/main/assets/VOICE_NOTICES.txt distribution/
          cp INSTALLATION.txt distribution/
          cd distribution
          sha256sum *.apk > SHA256SUMS.txt
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Sprechbruecke-v0.5-Android
          path: distribution/
          if-no-files-found: error
          retention-days: 14
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: |
            app/build/reports/
            voices/build/reports/
          if-no-files-found: ignore
