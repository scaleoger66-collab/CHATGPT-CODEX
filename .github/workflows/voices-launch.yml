name: Voice manager launch
on:
  push:
    paths: ['voices/**', '.github/workflows/voices-launch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRECHBRUECKE_DEBUG_KEYSTORE: ${{ github.workspace }}/.debug-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache/restore@v4
        with:
          path: .debug-signing/debug.keystore
          key: sprechbruecke-debug-signing-v2
      - run: test -s "$SPRECHBRUECKE_DEBUG_KEYSTORE"
      - run: bash ci/fetch-sherpa.sh
      - run: gradle --no-daemon :voices:testDebugUnitTest :voices:lintDebug :voices:assembleDebug
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -memory 4096 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon :voices:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.sprechbruecke.voices.VoiceActivityTest
      - name: Verify signed voice update
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs voices/build/outputs/apk/debug/voices-debug.apk
          mkdir -p distribution
          cp voices/build/outputs/apk/debug/voices-debug.apk distribution/Sprechbruecke-Stimmen-v0.2.apk
          cp voices/src/main/assets/*txt distribution/
          cp voices/INSTALLATION.txt distribution/
          cd distribution
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sprechbruecke-Stimmen-v0.2
          path: distribution/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-manager-launch-reports
          path: voices/build/reports/
